version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: workspace_admin
      POSTGRES_DB: workspace_db 
    ports:
      - "5432:5432"
